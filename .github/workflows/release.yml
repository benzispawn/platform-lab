name: Platform Lab - Release

on:
    push:
        branches: [main]
concurrency:
    group: release-main
    cancel-in-progress: false
jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24.14.1"
            - name: Install dependencies
              run: npm ci
            - name: Testing project
              run: npm test

    push-image:
        needs: test # runs only if the tests pass
        runs-on: ubuntu-latest
        environment: deploy # must be here, because the trust sub is ...:environment:deploy
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v6 # code + Dockerfile on this VM

            - uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: sa-east-1 # OIDC → temporary credentials in env vars

            - run: aws sts get-caller-identity # prints the assumed role = proof of authentication

            - id: ecr
              uses: aws-actions/amazon-ecr-login@v2 # docker login to your ECR registry

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.ecr.outputs.registry }}/platform-lab-repository:${{ github.sha }}
                  build-args: VERSION=${{ github.sha }}
